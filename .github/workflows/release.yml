name: release

# Push a tag vX.Y.Z whose version matches package.json and server.json. Job `npm` publishes the
# package through npm trusted publishing (OIDC, no token), with provenance. Job `registry` waits
# until npm serves that version (npm can take several minutes to process a release), then lists it
# in the MCP Registry as io.github.archestack/mcp, signed in through GitHub OIDC. If `registry`
# fails, "Re-run failed jobs" retries it alone, without publishing to npm again.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache in release builds
      - run: npm install -g npm@11.20.0 # trusted publishing needs npm 11.5.1 or later
      - run: npm ci
      - name: tag, package.json and server.json name the same version
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const pkg = require("./package.json");
            const server = require("./server.json");
            const versions = [pkg.version, server.version, ...server.packages.map((p) => p.version)];
            if (versions.some((v) => v !== tag)) throw new Error(`tag ${tag}, files ${versions}`);
          '
      - run: npm publish

  registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: wait until npm serves this version (up to about 20 minutes)
        run: |
          url="https://registry.npmjs.org/@archestack%2fmcp/${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            code=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = 200 ]; then exit 0; fi
            echo "npm answers $code, try $i"
            sleep $(( (i < 6 ? i * 10 : 60) + RANDOM % 10 ))
          done
          echo "::error::npm still does not serve ${GITHUB_REF_NAME#v}"
          exit 1
      - name: list the version in the MCP Registry
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
